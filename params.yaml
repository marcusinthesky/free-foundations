# One quarterly CRSP–SEC study: population, information, networks and in-sample
# inference. Every DVC stage declares the keys it reads; the CLI reads this file.
study:
  version: crsp-sec-quarterly-v2
  # Population: lagged-December top-N CRSP common stocks, issuer (PERMCO) portfolios.
  archive_start: "2001-01-01"
  archive_end: "2025-12-31"
  # SEC XBRL information begins in 2009; the spatial panel starts with full coverage.
  feature_start: "2009-01-01"
  panel_start: "2011-01-01"
  top_n: 1000
  frequency: quarterly
  # Fernández: ten annual characteristic snapshots and forty quarterly outcomes.
  characteristic_history_years: 10
  window_quarters: 40
  # December formations whose following forty quarters lie inside the archive.
  formation_years: [2010, 2011, 2012, 2013, 2014, 2015]
  primary_formation: 2015
  # MM betas need this many observed quarters inside the window.
  min_beta_quarters: 8
  # Comparison networks: symmetrized, row-normalized k-nearest neighbours, declared
  # before estimation. Fernández networks keep her literal exp(-d) kernel.
  neighbours: 10
  neighbour_sensitivities: [5, 20]
  seed: 42
  # Foundation-model context: column block width and labeled support rows. States are
  # encoded each January (first quarter) and networks held for that year's quarters.
  block_columns: 500
  # Standard rung: latest as-of value of each standard concept reported by at least
  # this share of the view's issuer-quarters (disclosure coverage, never outcomes).
  standard_min_coverage: 0.1
  support_rows: 256
  # In-sample inference: generated-beta refits, paired likelihood and Mantel draws.
  generated_beta_draws: 999
  likelihood_draws: 9999
  mantel_draws: 999
  rungs: [fernandez, standard_xbrl]
  models: [tabpfn_full, tabfm, kumo, limix]

# FinFM matched comparisons. New model cells require an explicit inference device.
t08:
  device: cuda
  threads: 6
  histories: [market_cap_assets, market_to_book, dividend_yield, debt_maturity]

# Out-of-sample spatial APT (FinFM extension), fixed before its DVC run. One roster
# (the primary formation's, every training month observed) and one information set
# (the January 2016 states) are shared by CAPM, APT and every spatial APT network.
apt:
  formation: 2015
  # Monthly loadings on the French five factors and momentum; covariances are fitted
  # on the training months and scored on the test months only.
  train_start: "2016-01"
  train_end: "2020-12"
  test_start: "2021-01"
  test_end: "2025-12"
  factors: [Mkt-RF, SMB, HML, RMW, CMA, Mom]
  neighbours: 10
  # Calibrated geometry: ridge readout of risk-scaled exposures, cross-fitted over
  # issuers; penalties chosen by leave-one-out within the training folds.
  folds: 5
  ridge_alphas: [0.01, 0.0316, 0.1, 0.316, 1.0, 3.16, 10.0, 31.6, 100.0, 316.0, 1000.0, 3160.0, 10000.0]
  clip: 10.0
  score_draws: 9999
  mantel_draws: 999
  seed: 42
