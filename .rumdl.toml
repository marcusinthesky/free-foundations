[global]
exclude = [".devenv/**", ".direnv/**", "**/.venv/**", "**/node_modules/**", "**/.lake/**", ".insitu/**", "**/build/**", "**/dist/**", "**/web/**", "**/print/**"]
# MD013 line-length: prose here wraps to sense, not to a column.
# MD041 first-line-heading: generated tables are fragments, not documents.
disable = ["MD013", "MD041"]

[MD025]
front-matter-title = ""
