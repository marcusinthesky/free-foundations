[project]
name = "free-foundations-workspace"
version = "0.1.0"
requires-python = "~=3.13.0"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*"]

[tool.uv.sources]
semflow = { git = "https://github.com/marcusinthesky/semflow.git", rev = "480f5932ff868783fe06a9c42cca6a37c37e086f" }
pytest-layout-enforcer = { git = "https://github.com/marcusinthesky/pytest-layout-enforcer", rev = "4a1911f444e30328e7e01a0c885f24486807021b" }
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'linux'" }]
LimiX = { git = "https://github.com/limix-ldm-ai/LimiX.git", rev = "516bf396333feb3198cf7aff8a6c10421f218e24" }
tabfm = { git = "https://github.com/google-research/tabfm.git", rev = "fbb665569425fd2f490c6576b3af967876fe11ff" }
structured-data-models = { git = "https://github.com/NVIDIA/structured-data-models.git", rev = "4d7397f6d7b23b1ca75a90ba965fa113671c458d" }

# CUDA wheels enable NVIDIA inference; runtimes fall back to CPU when CUDA is unavailable.
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
target-version = "py313"
line-length = 100
# First-party roots for import sorting: the application and its test helpers.
src = ["apps/free_foundations/src", "apps/free_foundations"]
# Exordio-owned PEP 723 scripts follow the template's own lint contract.
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["ALL"]
# Array ranks are clearer as 2/3 than named constants; no copyright boilerplate.
ignore = ["COM812", "D203", "D213", "CPY001", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
# Tests import as modules under --import-mode=importlib, not as packages.
"**/tests/**" = ["S101", "PLR2004", "D", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
preset = "strict"
python-version = "3.13"
project-includes = ["apps/*/src/**/*.py", "apps/*/tests/**/*.py"]
project-excludes = ["**/.venv/**"]
# Each application's tests import their shared strategies as `tests._strategies`.
search-path = ["apps/free_foundations/src", "apps/free_foundations"]

[tool.vulture]
paths = ["apps/free_foundations/src", "apps/free_foundations/tests"]
min_confidence = 80

[tool.pytest.ini_options]
testpaths = ["apps"]
pythonpath = ["apps/free_foundations"]
addopts = ["-ra", "--import-mode=importlib", "--strict-config", "--strict-markers"]
markers = [
  "unit: isolated behavior",
  "component: coherent subsystem behavior",
  "integration: interaction across components or real dependencies",
  "e2e: complete user-visible workflow",
  "slow: consistently takes more than two seconds",
  "external: accesses a live external service",
]

[tool.pytest-layout-enforcer]
enabled = true
feature-separator = "__"
require-tests = false
include-init = false
include-packages = true

[[tool.pytest-layout-enforcer.layouts]]
source = "apps/free_foundations/src/free_foundations"
tests = "apps/free_foundations/tests"

[dependency-groups]
dev = [
  "hatchling==1.27.0",
  "ruff>=0.16.5,<0.17",
  "pyrefly>=1.4,<2",
  "tach>=0.35.3,<0.36",
  "vulture>=2.16,<3",
  "pytest>=8,<10",
  "pytest-xdist>=3.8,<5",
  "pytest-testmon>=2.2,<3",
  "pytest-layout-enforcer",
  "hypothesis[numpy]>=6.170,<7",
  "pandas-stubs>=2.2,<3",
  "scipy-stubs>=1.15,<2",
  "dvc[s3]>=3.60,<4",
  # Semantic code fingerprints for the DVC stages; it imports the Typer app.
  "semflow",
]
