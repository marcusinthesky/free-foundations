[project]
name = "free-foundations"
version = "0.1.0"
description = "Typed measurements of firm proximity from tabular foundation models."
requires-python = "~=3.13.0"
dependencies = [
  "numpy>=2.3.5,<3",
  "pandas>=2.2,<3",
  "scipy>=1.15,<2",
  "scikit-learn>=1.7.2,<2",
  "typer>=0.16,<1",
]

[project.scripts]
free-foundations = "free_foundations.cli:app"

# Opt in to model runtimes; importing the interface never downloads weights.
[project.optional-dependencies]
exaone = ["exaonetabular"]
tabpfn = ["tabpfn==9.2.0", "torch>=2.9,<3"]
limix = ["LimiX", "triton>=3.5,<4; sys_platform == 'linux'"]
causilo = ["causilo==1.0.3"]
tabfm = ["tabfm[pytorch]"]
kumo = ["structured-data-models"]
sap = ["sap-rpt-oss", "transformers<5"]

[dependency-groups]
data = [
  "spreg>=1.9.1,<2",
  "libpysal>=4.13,<5",
  "esda>=2.7,<3",
  "yfinance>=1.7,<2",
  "pandas-datareader>=0.11.1,<0.12",
  "edgartools>=5.62,<6",
  "httpx>=0.28,<1",
  "marimo>=0.25,<0.26",
  "pyarrow>=20",
  "matplotlib>=3.10,<4",
  "jinja2>=3.1,<4",  # pandas LaTeX tables and manuscript scalar bindings
  "tabulate>=0.10,<1",  # pandas Markdown tables in saved-result reports
  "arch>=7.2,<8",
]
dev = [
  "ruff>=0.16.5,<0.17",
  "pyrefly>=1.4,<2",
  "tach>=0.35.3,<0.36",
  "vulture>=2.16,<3",
  "pytest>=8,<10",
  "pytest-testmon>=2.2,<3",
  "hypothesis[numpy]>=6.170,<7",
  "pandas-stubs>=2.2,<3",
  "scipy-stubs>=1.15,<2",
  # Semantic code fingerprints for the DVC stages; it imports the Typer app.
  "semflow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/free_foundations"]

[tool.uv]
default-groups = ["dev", "data"]

[tool.uv.sources]
semflow = { git = "https://github.com/marcusinthesky/semflow.git", rev = "480f5932ff868783fe06a9c42cca6a37c37e086f" }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
exaonetabular = { git = "https://github.com/LGAI-Research/EXAONE-Tabular.git", rev = "841927fc4f2c573db5c88325f64ecc4fe5affd12" }
LimiX = { git = "https://github.com/limix-ldm-ai/LimiX.git", rev = "516bf396333feb3198cf7aff8a6c10421f218e24" }
tabfm = { git = "https://github.com/google-research/tabfm.git", rev = "fbb665569425fd2f490c6576b3af967876fe11ff" }
structured-data-models = { git = "https://github.com/NVIDIA/structured-data-models.git", rev = "4d7397f6d7b23b1ca75a90ba965fa113671c458d" }
sap-rpt-oss = { git = "https://github.com/SAP-samples/sap-rpt-1-oss.git", rev = "a0067b3c9db56bc35a6dcab09a9223a3ff0821e0" }

# CPU wheels keep the small research pilot usable without a CUDA installation.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# Array ranks are clearer as 2/3 than named constants; no copyright boilerplate.
ignore = ["COM812", "D203", "D213", "CPY001", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
preset = "strict"
python-version = "3.13"
project-includes = ["src/**/*.py", "tests/**/*.py"]
project-excludes = [".venv/**"]
search-path = ["src", "."]

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
