source_roots = ["apps/free_foundations/src"]
exclude = ["**/tests/**", "**/.venv/**", "scripts/**"]
exact = true
ignore_type_checking_imports = false
forbid_circular_dependencies = true

[[modules]]
path = "free_foundations.contracts"
depends_on = []

[[modules]]
path = "free_foundations.pooling"
depends_on = ["free_foundations.contracts"]

[[modules]]
path = "free_foundations.registry"
depends_on = []

[[modules]]
path = "free_foundations.encoding"
depends_on = ["free_foundations.contracts", "free_foundations.pooling", "free_foundations.registry"]

[[modules]]
path = "free_foundations"
depends_on = ["free_foundations.contracts", "free_foundations.pooling", "free_foundations.registry", "free_foundations.encoding"]

[[modules]]
path = "free_foundations.data"
depends_on = []

[[modules]]
path = "free_foundations.runtime"
depends_on = []

[[modules]]
path = "free_foundations.representations"
depends_on = ["free_foundations.contracts", "free_foundations", "free_foundations.data", "free_foundations.runtime"]

[[modules]]
path = "free_foundations.fernandez"
depends_on = []

[[modules]]
path = "free_foundations.study"
depends_on = ["free_foundations.contracts", "free_foundations.data", "free_foundations.representations", "free_foundations.fernandez"]

[[modules]]
path = "free_foundations.stages"
depends_on = ["free_foundations.representations", "free_foundations.study"]

[[modules]]
path = "free_foundations.cli"
depends_on = ["free_foundations.stages"]
