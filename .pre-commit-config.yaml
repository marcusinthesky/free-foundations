default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: builtin
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: detect-private-key
        stages: [pre-commit, pre-push]
      - id: check-added-large-files
        stages: [pre-commit, pre-push]
      - id: check-case-conflict
  - repo: local
    hooks:
      - id: workflow-lint
        name: GitHub Actions workflow syntax
        entry: bash -c 'actionlint .github/workflows/*.yml'
        language: system
        pass_filenames: false
        always_run: true
      - id: shellcheck
        name: ShellCheck scripts
        entry: shellcheck
        language: system
        types: [shell]
        files: \.sh$
      - id: markdown
        name: Markdown formatting and local links
        entry: rumdl check .
        language: system
        pass_filenames: false
        types: [markdown]
      - id: codespell
        name: Spelling
        entry: codespell
        language: system
        types: [text]
        # The AAAI author kit is kept byte-identical to its upstream release.
        exclude: ^src/latex/projects/free-foundations/src/vendor/aaai2027\.(sty|bst)$
      - id: nix-format
        name: Nix formatting
        entry: nixfmt --check
        language: system
        types: [nix]
      - id: nix-lint
        name: Nix anti-patterns
        entry: statix check infra/nix
        language: system
        pass_filenames: false
        types: [nix]
      - id: nix-dead-code
        name: Unused Nix bindings
        entry: deadnix --fail
        language: system
        types: [nix]
      - id: toml-format
        name: TOML formatting
        entry: tombi format --offline --check
        language: system
        types: [toml]
        # uv owns its lock files; AgentSync's configuration is template-owned.
        exclude: (^|/)uv\.lock$|^\.agents/agentsync\.toml$
      - id: toml-lint
        name: TOML lint
        entry: tombi lint --offline
        language: system
        types: [toml]
      - id: prek-config
        name: Hook configuration parses
        entry: prek validate-config
        language: system
        files: (^|/)\.pre-commit-config\.yaml$
      - id: just-format
        name: Justfile formatting and syntax
        entry: >-
          bash -c 'rc=0; for f; do just --justfile "$f" --fmt --check --unstable || rc=1; done; exit "$rc"' --
        language: system
        files: (^|/)([Jj]ustfile|[^/]+\.just)$
      - id: just-lint
        name: Justfile analysis
        entry: >-
          bash -c 'rc=0; for f; do just-lsp analyze "$f" || rc=1; done; exit "$rc"' --
        language: system
        files: (^|/)([Jj]ustfile|[^/]+\.just)$
      - id: text-check
        name: Whitespace and final newlines
        entry: bash infra/nix/check-text.sh
        language: system
        types: [text]
        # DVC owns dvc.lock: its YAML writer leaves a trailing space on wrapped `cmd:`
        # scalars, re-emitted by every `dvc repro`. The AAAI author kit must stay
        # byte-identical to the published files.
        exclude: ^dvc\.lock$|^src/latex/projects/free-foundations/src/vendor/aaai2027\.(sty|bst)$
      - id: conventional-commit
        name: Conventional commit message
        entry: bash -euc 'exec convco check --from-stdin < "$1"' --
        language: system
        stages: [commit-msg]

      # ── Languages ────────────────────────────────────────────────────────
      # Full test suites, builds and blueprint PDFs run in `just check` and CI.
      - id: python-quality
        name: Python lint, strict types, architecture and test layout
        entry: bash -c 'just python::lint python::typecheck python::tach python::layout python::vulture'
        language: system
        pass_filenames: false
        files: ^src/python/
      - id: lean-proofs
        name: Lean contracts, proof integrity, axioms and lint
        entry: bash -c 'just lean::proof-audit lean::axiom-audit lean::lint'
        language: system
        pass_filenames: false
        files: ^src/lean/.*(\.lean|\.toml|\.json|lean-toolchain)$
      - id: lean-checker-tests
        name: Lean checker regression tests
        entry: just lean::proof-audit-test
        language: system
        pass_filenames: false
        files: ^src/lean/(tools/|FreeFoundationsApi/Check\.lean)
      - id: blueprint-declarations
        name: Blueprint and manuscript declarations
        entry: just lean::blueprint-check
        language: system
        pass_filenames: false
        files: ^(src/lean/.*\.(lean|tex|toml)|src/latex/projects/free-foundations/src/sections/.*\.tex)$
      - id: latex-lint
        name: LaTeX formatting and lint
        entry: just latex::lint
        language: system
        pass_filenames: false
        files: ^src/latex/.*\.(tex|sty|cls)$

      # ── Data pipeline ────────────────────────────────────────────────────
      - id: dvc-metadata
        name: DVC metadata
        entry: just data-check
        language: system
        pass_filenames: false
        files: ^(dvc\.(yaml|lock)|\.dvc/|.*\.dvc$)
      # The fingerprint JSON is each stage's code dependency, so a stale one would
      # suppress a genuine rerun; this read-only check keeps it current.
      - id: semflow-check
        name: Semflow fingerprints
        entry: just semflow-check
        language: system
        pass_filenames: false
        files: ^dvc\.yaml$|^semflow\.toml$|^src/python/.*\.py$|^\.semflow/hashes/.*\.json$
      # Opt in to upload tracked data on every `git push`: uncomment once the bucket
      # credentials are in .dvc/config.local. The first push sends about 3.6 GB.
      # - id: dvc-pre-push
      #   name: DVC push
      #   entry: just dvc git-hook pre-push
      #   language: system
      #   stages: [pre-push]
      #   pass_filenames: false
      #   always_run: true

      # ── Context and agents ───────────────────────────────────────────────
      - id: context-documents
        name: Context schemas and generated views
        entry: just context-check
        language: system
        pass_filenames: false
        always_run: true
      - id: schema-changelog-document
        name: Changelog structure and categories
        entry: just changelog-check
        language: system
        pass_filenames: false
        files: ^(CHANGELOG\.md|infra/schemas/documents/changelog\.document-schema\.yaml)$
      - id: skill-documents
        name: Agent skill documents
        entry: just skills-check
        language: system
        pass_filenames: false
        files: (^|/)(SKILL\.md|skill\.document-schema\.yaml)$
