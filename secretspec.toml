[project]
name = "free-foundations"
revision = "1.0"

[providers]
google = "gcsm://research-473706"

# Commands resolve their own profile; the devenv shell never fetches secrets.
[profiles.wrds.WRDS_USERNAME]
description = "WRDS account name for the PostgreSQL research database"
required = true
providers = ["google"]
ref = { item = "WRDS_USERNAME" }

[profiles.wrds.WRDS_PASSWORD]
description = "WRDS account password for the PostgreSQL research database"
required = true
providers = ["google"]
ref = { item = "WRDS_PASSWORD" }
