# Pipeline layers: raw -> processed -> research (data/README.md).
#
## Raw: frozen sources
# The WRDS CRSP CIZ extract, public SEC CompanyFacts and submissions, historical
# identifier evidence and French factors, acquired explicitly into data/staging and
# promoted by `stages raw freeze`. Pinned model weights are verified local downloads.
#
## Processed: reusable panels
# One quarterly issuer roster and outcome mask, December formation cohorts, as-of
# characteristics and XBRL facts, then frozen representation states for each rung.
#
## Research: in-sample results
# Fernández cross-sections, quarterly spatial co-movement panels and Mantel
# alignment, each with in-sample intervals, then the saved-result report.
vars:
- py: env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python --offline --frozen --package free-foundations free-foundations stages
- models: env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV TABPFN_DISABLE_TELEMETRY=1 uv run --project src/python --offline --frozen --package free-foundations --extra tabpfn --extra tabfm --extra kumo --extra limix free-foundations stages
- semflow: env -u PYTHONPATH -u PYTHONHOME -u VIRTUAL_ENV uv run --project src/python --offline --frozen --all-packages semflow

# Publication writes its metrics inside its tracked output directory.
metrics:
- data/research/crsp-sec/publication/metrics.json

stages:
  semflow_refresh:
    desc: >-
      Refresh semantic entrypoint fingerprints after source changes. This control
      stage owns the JSON only; instrumenting dvc.yaml stays a reviewed `just semflow-apply`.
    cmd: ${semflow} refresh --apply
    deps:
    - semflow.toml
    - src/python/pyproject.toml
    - src/python/apps/free_foundations/pyproject.toml
    - src/python/uv.lock
    - src/python/apps/free_foundations/src
    outs:
    - .semflow/hashes:
        cache: false

  crsp_sec_sources:
    desc: >-
      Frozen CRSP CIZ monthly extract, SEC CompanyFacts, submissions, identifier
      evidence and French factors. Acquisition is `stages raw acquire` then `freeze`.
    cmd: 'false'
    frozen: true
    deps:
    - src/python/uv.lock
    outs:
    - data/raw/crsp-sec:
        persist: true

  model_checkpoints:
    desc: Acquire and verify the four pinned pretrained model revisions.
    cmd: ${models} raw checkpoints --output data/raw/models
    deps:
    - .semflow/hashes/entrypoints/free-foundations/stages/raw/checkpoints.json
    - src/python/uv.lock
    - src/python/apps/free_foundations/pyproject.toml
    - src/python/apps/free_foundations/src/free_foundations/checkpoints.json
    outs:
    - data/raw/models/manifest.json

  prepare:
    desc: >-
      Quarterly issuer roster and outcome mask, December formation cohorts, CRSP-ME
      characteristics, current SIC and as-of CompanyFacts information sets.
    cmd: >-
      ${py} processed prepare --sources data/raw/crsp-sec
      --output data/processed/crsp-sec/panel
    params:
    - study.version
    - study.archive_start
    - study.archive_end
    - study.feature_start
    - study.top_n
    - study.frequency
    - study.formation_years
    - study.window_quarters
    deps:
    - .semflow/hashes/entrypoints/free-foundations/stages/processed/prepare.json
    - data/raw/crsp-sec
    - src/python/uv.lock
    outs:
    - data/processed/crsp-sec/panel

  representations:
    desc: Both information rungs with every pinned model and the direct control.
    cmd: >-
      ${models} processed encode --panel data/processed/crsp-sec/panel
      --weights data/raw/models --states data/processed/crsp-sec/state-cache
      --output data/processed/crsp-sec/representations
    params:
    - study.panel_start
    - study.characteristic_history_years
    - study.block_columns
    - study.standard_min_coverage
    - study.support_rows
    - study.rungs
    - study.models
    deps:
    - .semflow/hashes/entrypoints/free-foundations/stages/processed/encode.json
    - data/processed/crsp-sec/panel
    - data/raw/models/manifest.json
    - src/python/uv.lock
    - src/python/apps/free_foundations/pyproject.toml
    outs:
    - data/processed/crsp-sec/representations

  replication:
    desc: >-
      Fernández cross-sections for every formation and network: MM betas, OLS,
      spatial lag (IV and ML) and error (ML), with and without an intercept.
    cmd: >-
      ${py} research replicate --panel data/processed/crsp-sec/panel
      --representations data/processed/crsp-sec/representations
      --output data/research/crsp-sec/replication
    params:
    - study
    deps:
    - .semflow/hashes/entrypoints/free-foundations/stages/research/replicate.json
    - data/processed/crsp-sec/panel
    - data/processed/crsp-sec/representations
    - src/python/apps/free_foundations/src/free_foundations/fernandez/betas.R
    - src/python/uv.lock
    - infra/nix/devenv.nix
    - devenv.lock
    outs:
    - data/research/crsp-sec/replication

  comovement:
    desc: Quarterly spatial panels of excess returns with period effects, by network.
    cmd: >-
      ${py} research comovement --panel data/processed/crsp-sec/panel
      --representations data/processed/crsp-sec/representations
      --output data/research/crsp-sec/comovement
    params:
    - study
    deps:
    - .semflow/hashes/entrypoints/free-foundations/stages/research/comovement.json
    - data/processed/crsp-sec/panel
    - data/processed/crsp-sec/representations
    - src/python/uv.lock
    outs:
    - data/research/crsp-sec/comovement

  alignment:
    desc: Mantel association of network distances with realized return co-movement.
    cmd: >-
      ${py} research alignment --panel data/processed/crsp-sec/panel
      --representations data/processed/crsp-sec/representations
      --output data/research/crsp-sec/alignment
    params:
    - study
    deps:
    - .semflow/hashes/entrypoints/free-foundations/stages/research/alignment.json
    - data/processed/crsp-sec/panel
    - data/processed/crsp-sec/representations
    - src/python/uv.lock
    outs:
    - data/research/crsp-sec/alignment

  apt:
    desc: Out-of-sample spatial APT on characteristic, raw and calibrated foundation-model geometry.
    cmd: >-
      ${py} research apt --panel data/processed/crsp-sec/panel
      --representations data/processed/crsp-sec/representations
      --factors data/raw/crsp-sec/factors
      --output data/research/crsp-sec/apt
    params:
    - study
    - apt
    deps:
    - .semflow/hashes/entrypoints/free-foundations/stages/research/apt.json
    - data/processed/crsp-sec/panel
    - data/processed/crsp-sec/representations
    - data/raw/crsp-sec/factors/F-F_Research_Data_5_Factors_2x3_CSV.zip
    - data/raw/crsp-sec/factors/F-F_Momentum_Factor_CSV.zip
    - src/python/uv.lock
    outs:
    - data/research/crsp-sec/apt

  publication:
    desc: Tables, figures and the claims audit from saved results only.
    cmd: >-
      ${py} research publish --panel data/processed/crsp-sec/panel
      --replication data/research/crsp-sec/replication
      --comovement data/research/crsp-sec/comovement
      --alignment data/research/crsp-sec/alignment
      --output data/research/crsp-sec/publication
      --tex src/latex/build/crsp-study.tex
    params:
    - study
    deps:
    - .semflow/hashes/entrypoints/free-foundations/stages/research/publish.json
    - data/processed/crsp-sec/panel/manifest.json
    - data/raw/models/manifest.json
    - data/research/crsp-sec/replication
    - data/research/crsp-sec/comovement
    - data/research/crsp-sec/alignment
    - src/python/uv.lock
    outs:
    - src/latex/build/crsp-study.tex
    - src/latex/build/rolling-rho.pdf
    - data/research/crsp-sec/publication
