    - research/pilot/summary.csv:
        cache: false
    - research/pilot/universe.csv:
        cache: false
    - research/pilot/universe-exclusions.json:
        cache: false

  market_metadata:
    cmd: "false"  # Recorded source snapshot: no acquisition command in reproduction.
    desc: Frozen SEC industry classification and Yahoo corporate-action snapshots; restore rather
      than refetch.
    frozen: true
    outs:
    - research/expanded/industry.csv:
        cache: false
    - research/expanded/cache/submissions
    - research/fernandez/cache/markets
    - research/panel/cache/market-tail.parquet

  expanded_run:
    desc: >-
      Expanded representation and metric grid on the pilot's cached inputs.
    cmd: ${heavy} expanded run
    deps:
    - .semflow/hashes/entrypoints/free-foundations/expanded/run.json
    - src/python/uv.lock
    - research/pilot/cache
    - research/pilot/universe.csv
    - research/expanded/industry.csv
