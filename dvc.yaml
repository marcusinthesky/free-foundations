# One matched quarterly CRSP–SEC study; acquisition is explicit and frozen under repro.
# Earlier current-survivor stages and hashes are inactive snapshots in research/archive.
vars:
- ff: uv run --project src/python --frozen free-foundations
- models: TABPFN_DISABLE_TELEMETRY=1 uv run --project src/python --frozen --extra tabpfn --extra tabfm --extra kumo --extra limix free-foundations

stages:
  sources:
    desc: Frozen staged CRSP extract, public SEC evidence and quarterly factor sources.
    cmd: 'false'
    frozen: true
    deps:
    - research/crsp-study/study.json
    - src/python/uv.lock
    outs:
    - research/crsp-study/sources:
        persist: true
  model_checkpoints:
    desc: Acquire and verify only the four declared pretrained model revisions.
    cmd: ${models} models checkpoints
    deps:
    - .semflow/hashes/entrypoints/free-foundations/models/checkpoints.json
    - src/python/uv.lock
    - src/python/pyproject.toml
    - src/python/src/free_foundations/checkpoints.json
    outs:
    - research/model-checkpoints.json
  prepare:
    desc: One quarterly roster, common outcome mask, return history and as-of XBRL ladder.
    cmd: ${ff} study prepare
    deps:
    - .semflow/hashes/entrypoints/free-foundations/study/prepare.json
    - src/python/uv.lock
    - research/crsp-study/study.json
    - research/crsp-study/sources
    outs:
    - research/crsp-study/prepared
  representations:
    desc: All information rungs on the same quarterly master panel and frozen checkpoints.
    cmd: ${models} study encode
    deps:
    - .semflow/hashes/entrypoints/free-foundations/study/encode.json
    - src/python/uv.lock
    - src/python/pyproject.toml
    - research/model-checkpoints.json
    - research/crsp-study/study.json
    - research/crsp-study/prepared
    outs:
    - research/crsp-study/representations
  measurement:
    desc: Matched representations, quarterly covariance scores, geometry and inference.
    cmd: ${ff} study run
    deps:
    - .semflow/hashes/entrypoints/free-foundations/study/run.json
    - src/python/uv.lock
    - research/crsp-study/study.json
    - research/crsp-study/prepared
    - research/crsp-study/representations
    outs:
    - research/crsp-study/measurement
  replication:
    desc: Original quarterly MM CAPM and spatial core on the same master experiment.
    cmd: ${ff} study replicate
    deps:
    - .semflow/hashes/entrypoints/free-foundations/study/replicate.json
    - src/python/uv.lock
    - research/crsp-study/study.json
    - research/crsp-study/prepared
    - src/python/src/free_foundations/fernandez/betas.R
    - devenv.nix
    - devenv.lock
    outs:
    - research/crsp-study/replication
  publication:
    desc: Render matched study results and source coverage from saved artifacts only.
    cmd: ${ff} study report
    deps:
    - .semflow/hashes/entrypoints/free-foundations/study/report.json
    - src/python/uv.lock
    - research/crsp-study/study.json
    - research/model-checkpoints.json
    - research/crsp-study/prepared/manifest.json
    - research/crsp-study/representations
    - research/crsp-study/measurement
    - research/crsp-study/replication
    - src/latex/main.tex
    outs:
    - src/latex/build/crsp-study.tex
    - research/crsp-study/publication
