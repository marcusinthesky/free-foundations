# One theory-led measurement study. Frozen sources are restored, never reacquired by repro.
# Numerical state extraction is isolated from financial calibration and publication.
vars:
- ff: uv run --project src/python --frozen free-foundations
- models: TABPFN_DISABLE_TELEMETRY=1 uv run --project src/python --frozen --extra tabpfn --extra tabfm --extra kumo --extra limix free-foundations

stages:
  universe:
    desc: Frozen SEC and market snapshots for the current-survivor US universe.
    cmd: 'false'
    frozen: true
    outs:
    - research/universe/cache:
        persist: true
    - research/universe/configuration.json:
        cache: false
    - research/universe/coverage.csv:
        cache: false
    - research/universe/manifest.json:
        cache: false
    - research/universe/price-coverage.json:
        cache: false
    - research/universe/price-failures.json:
        cache: false
    - research/universe/README.md:
        cache: false
    - research/universe/status.json:
        cache: false
    - research/universe/universe.csv:
        cache: false
    - research/universe/universe-exclusions.json:
        cache: false
  pilot:
    desc: Original raw financial input snapshot, retained only for source provenance.
    cmd: 'false'
    frozen: true
    outs:
    - research/pilot/cache:
        persist: true
  market_metadata:
    desc: Frozen corporate-action tail used to construct historical characteristics.
    cmd: 'false'
    frozen: true
    outs:
    - research/panel/cache/market-tail.parquet
  model_checkpoints:
    desc: Acquire and verify only the four declared pretrained model revisions.
    cmd: ${models} models checkpoints
    deps:
    - .semflow/hashes/entrypoints/free-foundations/models/checkpoints.json
    - src/python/uv.lock
    - src/python/pyproject.toml
    - src/python/src/free_foundations/checkpoints.json
    outs:
    - research/model-checkpoints.json
  prepare:
    desc: Filing-value and price audits, shared characteristics, cohorts and return windows.
    cmd: ${ff} panel prepare
    deps:
    - .semflow/hashes/entrypoints/free-foundations/panel/prepare.json
    - src/python/uv.lock
    - research/universe/cache
    - research/universe/universe.csv
    - research/panel/cache/market-tail.parquet
    outs:
    - research/panel/cache/four.parquet
    - research/panel/cache/broad.parquet
    - research/panel/cache/characteristic-audit.parquet
    - research/panel/cache/characteristics
    - research/panel/characteristic-coverage.csv
    - research/panel/price-audit.csv
    - research/panel/disclosure-audit.json:
        cache: false
    - research/panel/prepared
  representations:
    desc: Declared frozen-model and baseline states on shared past-only contexts.
    cmd: ${models} panel encode
    deps:
    - .semflow/hashes/entrypoints/free-foundations/panel/encode.json
    - src/python/uv.lock
    - src/python/pyproject.toml
    - research/model-checkpoints.json
    - research/panel/cache/four.parquet
    - research/panel/cache/broad.parquet
    - research/panel/prepared
    outs:
    - research/panel/representations
    - research/panel/representation-manifest.json
  measurement:
    desc: Economic readouts, bounded diagnostic comparisons and covariance evaluation.
    cmd: ${ff} panel run
    deps:
    - .semflow/hashes/entrypoints/free-foundations/panel/run.json
    - src/python/uv.lock
    - research/panel/cache/four.parquet
    - research/panel/cache/broad.parquet
    - research/panel/prepared
    - research/panel/representations
    - research/panel/representation-manifest.json
    - research/model-checkpoints.json
    - research/panel/three-foundations/README.md
    - research/panel/three-foundations-validation/README.md
    - research/panel/geometry/README.md
    outs:
    - research/panel/three-foundations/daily-scores.parquet
    - research/panel/three-foundations/annual-scores.csv
    - research/panel/three-foundations/comparison.csv
    - research/panel/three-foundations/decoding.csv
    - research/panel/three-foundations/target-audit.csv
    - research/panel/three-foundations/geometry.csv
    - research/panel/three-foundations/bootstrap.csv
    - research/panel/three-foundations/contrasts.csv
    - research/panel/three-foundations/mcs.csv
    - research/panel/three-foundations/configuration.json
    - research/panel/three-foundations/manifest.json
    - research/panel/three-foundations/checkpoints.json
    - research/panel/three-foundations/observations
    - research/panel/three-foundations/contexts
    - research/panel/three-foundations-validation/daily-scores.parquet
    - research/panel/three-foundations-validation/annual-scores.csv
    - research/panel/three-foundations-validation/scores.csv
    - research/panel/three-foundations-validation/decoding.csv
    - research/panel/three-foundations-validation/null-checks.csv
    - research/panel/three-foundations-validation/contrasts.csv
    - research/panel/three-foundations-validation/principal-contrasts.csv
    - research/panel/three-foundations-validation/configuration.json
    - research/panel/three-foundations-validation/validation.json
    - research/panel/three-foundations-validation/observations
    - research/panel/geometry/daily-scores.parquet
    - research/panel/geometry/annual-scores.csv
    - research/panel/geometry/comparison.csv
    - research/panel/geometry/contrasts.csv
    - research/panel/geometry/spectrum.csv
    - research/panel/geometry/pcoa-summary.csv
    - research/panel/geometry/coordinates.parquet
    - research/panel/geometry/weights.parquet
    - research/panel/geometry/component-returns.parquet
    - research/panel/geometry/component-covariance.csv
    - research/panel/geometry/characteristic-associations.csv
    - research/panel/geometry/extremes.csv
    - research/panel/geometry/stability.csv
    - research/panel/geometry/configuration.json
    - research/panel/geometry/manifest.json
  replication:
    desc: Core CAPM common-cohort replication, generated-beta inference and VaR audit.
    cmd: ${ff} fernandez run
    deps:
    - .semflow/hashes/entrypoints/free-foundations/fernandez/run.json
    - src/python/src/free_foundations/fernandez/betas.R
    - src/python/uv.lock
    - research/panel/cache/four.parquet
    - research/universe/cache/prices.parquet
    - research/universe/cache/factors.parquet
    - devenv.nix
    - devenv.lock
    outs:
    - research/replication
  publication:
    desc: Render the paper's tables, figure and claim audit from saved results only.
    cmd: ${ff} panel report
    deps:
    - .semflow/hashes/entrypoints/free-foundations/panel/report.json
    - src/python/uv.lock
    - src/latex/render_results.py
    - src/latex/numbers.tex.j2
    - src/latex/main.tex
    - research/panel/three-foundations/README.md
    - research/panel/three-foundations-validation/README.md
    - research/panel/geometry/README.md
    - research/panel/representation-manifest.json
    - research/replication
    - research/panel/disclosure-audit.json
    - research/panel/three-foundations/daily-scores.parquet
    - research/panel/three-foundations/annual-scores.csv
    - research/panel/three-foundations/comparison.csv
    - research/panel/three-foundations/decoding.csv
    - research/panel/three-foundations/target-audit.csv
    - research/panel/three-foundations/geometry.csv
    - research/panel/three-foundations/bootstrap.csv
    - research/panel/three-foundations/contrasts.csv
    - research/panel/three-foundations/mcs.csv
    - research/panel/three-foundations/configuration.json
    - research/panel/three-foundations/manifest.json
    - research/panel/three-foundations/checkpoints.json
    - research/panel/three-foundations/observations
    - research/panel/three-foundations/contexts
    - research/panel/three-foundations-validation/daily-scores.parquet
    - research/panel/three-foundations-validation/annual-scores.csv
    - research/panel/three-foundations-validation/scores.csv
    - research/panel/three-foundations-validation/decoding.csv
    - research/panel/three-foundations-validation/null-checks.csv
    - research/panel/three-foundations-validation/contrasts.csv
    - research/panel/three-foundations-validation/principal-contrasts.csv
    - research/panel/three-foundations-validation/configuration.json
    - research/panel/three-foundations-validation/validation.json
    - research/panel/three-foundations-validation/observations
    - research/panel/geometry/daily-scores.parquet
    - research/panel/geometry/annual-scores.csv
    - research/panel/geometry/comparison.csv
    - research/panel/geometry/contrasts.csv
    - research/panel/geometry/spectrum.csv
    - research/panel/geometry/pcoa-summary.csv
    - research/panel/geometry/coordinates.parquet
    - research/panel/geometry/weights.parquet
    - research/panel/geometry/component-returns.parquet
    - research/panel/geometry/component-covariance.csv
    - research/panel/geometry/characteristic-associations.csv
    - research/panel/geometry/extremes.csv
    - research/panel/geometry/stability.csv
    - research/panel/geometry/configuration.json
    - research/panel/geometry/manifest.json
    outs:
    - src/latex/build/measurement.tex
    - src/latex/build/measurement-benchmarks.tex
    - src/latex/build/decoder-periods.tex
    - src/latex/build/replication.tex
    - src/latex/build/replication-iv.tex
    - src/latex/build/weight-contrasts.tex
    - src/latex/build/confidence-set.tex
