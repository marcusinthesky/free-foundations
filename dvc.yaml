# Research pipeline. Computational stages follow `free-foundations` commands; semflow replaces each
# stage's Python source dependency with a fingerprint of the code its command reaches.
#
# Resume caches written by several stages (foundation-model states in
# research/expanded/cache/embeddings) and the v1 records without a producer are
# `dvc add` snapshots instead of stage outputs. `persist` marks network caches that a
# rerun extends rather than refetches.

vars:
- ff: uv run --project src/python --frozen free-foundations
- pilot: TABPFN_DISABLE_TELEMETRY=1 uv run --project src/python --frozen --extra tabpfn
    free-foundations
- heavy: OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 TABPFN_DISABLE_TELEMETRY=1 uv run --project
    src/python --frozen --extra tabpfn --extra tabfm --extra exaone free-foundations

stages:
  model_checkpoints:
    desc: Acquire pinned model revisions and record verified hashes; financial snapshots are
      unchanged.
    cmd: ${pilot} expanded checkpoints
    deps:
    - .semflow/hashes/entrypoints/free-foundations/expanded/checkpoints.json
    - src/python/uv.lock
    - src/python/pyproject.toml
    - research/pilot/cache/checkpoint.json
    outs:
    - research/model-checkpoints.json
  panel_run_three_foundations:
    desc: Representative frozen-model measurement experiment, including Kumo Large and LimiX-2.
    cmd: >-
      OPENBLAS_NUM_THREADS=2 OMP_NUM_THREADS=2 TABPFN_DISABLE_TELEMETRY=1
      uv run --project src/python --frozen --extra tabpfn --extra tabfm
      --extra kumo --extra limix free-foundations panel run --design three-foundations
    deps:
    - .semflow/hashes/entrypoints/free-foundations/panel/run.json
    - src/python/uv.lock
    - research/panel/cache/four.parquet
    - research/panel/cache/broad.parquet
    - research/universe/cache
    - research/panel/three-foundations/README.md
    - src/python/pyproject.toml
    - research/model-checkpoints.json
    - research/pilot/cache/checkpoint.json
    outs:
    - research/panel/three-foundations/daily-scores.parquet
    - research/panel/three-foundations/annual-scores.csv
    - research/panel/three-foundations/comparison.csv
    - research/panel/three-foundations/decoding.csv
    - research/panel/three-foundations/target-audit.csv
    - research/panel/three-foundations/attribution.csv
    - research/panel/three-foundations/geometry.csv
    - research/panel/three-foundations/bootstrap.csv
    - research/panel/three-foundations/contrasts.csv
    - research/panel/three-foundations/mcs.csv
    - research/panel/three-foundations/placebo.csv
    - research/panel/three-foundations/configuration.json
    - research/panel/three-foundations/observations
    - research/panel/three-foundations/distances
    - research/panel/three-foundations/contexts
  panel_report_three_foundations:
    desc: Report and provenance for the representative foundation-model experiment.
    cmd: ${ff} panel report --design three-foundations
    deps:
    - .semflow/hashes/entrypoints/free-foundations/panel/report.json
    - src/python/uv.lock
    - research/panel/cache/characteristics
    - research/panel/cache/four.parquet
    - research/panel/cache/broad.parquet
    - research/panel/three-foundations/comparison.csv
    - research/panel/three-foundations/configuration.json
    - research/panel/three-foundations/decoding.csv
    - research/panel/three-foundations/target-audit.csv
    - research/panel/three-foundations/bootstrap.csv
    - research/panel/three-foundations/contrasts.csv
    - research/panel/three-foundations/mcs.csv
    - research/panel/three-foundations/placebo.csv
    - research/panel/three-foundations/geometry.csv
    - research/panel/three-foundations/attribution.csv
    - research/panel/three-foundations/annual-scores.csv
    - research/panel/three-foundations/daily-scores.parquet
    - research/panel/three-foundations/contexts
    - research/panel/three-foundations/distances
    - research/panel/three-foundations/observations
    - src/python/pyproject.toml
    - research/model-checkpoints.json
    - research/universe/cache/prices.parquet
    - research/universe/cache/factors.parquet
    outs:
    - research/panel/three-foundations/manifest.json
    - research/panel/three-foundations/RESULTS.md:
        cache: false
    - research/panel/three-foundations/checkpoints.json
    - research/panel/three-foundations/disclosure-audit.json
  universe:
    desc: >-
      Acquire the larger public-data universe from SEC EDGAR and Yahoo. Network inputs cannot be rebuilt
      bit for bit, so the stage is frozen; needs EDGAR_IDENTITY.
    cmd: ${ff} universe run
    frozen: true
    deps:
    - .semflow/hashes/entrypoints/free-foundations/universe/run.json
    - src/python/uv.lock
    - src/python/pyproject.toml
    outs:
    - research/universe/cache:
        persist: true
    - research/universe/configuration.json:
        cache: false
    - research/universe/coverage.csv:
        cache: false
    - research/universe/manifest.json:
        cache: false
    - research/universe/price-coverage.json:
        cache: false
    - research/universe/price-failures.json:
        cache: false
    - research/universe/README.md:
        cache: false
    - research/universe/status.json:
        cache: false
    - research/universe/universe.csv:
        cache: false
    - research/universe/universe-exclusions.json:
        cache: false

  pilot:
    desc: >-
      Cache the pilot's market and SEC inputs and run the original experiment. Network inputs, so frozen;
      the TabPFN checkpoint is refetched, not tracked.
    cmd: ${pilot} pilot run --stage all --pretrained
    frozen: true
    deps:
    - .semflow/hashes/entrypoints/free-foundations/pilot/run.json
    - src/python/uv.lock
